name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o build/AmitPatelDentalSoftware.exe main.go

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" AmitPatelDentalSoftware.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amit-Patel-Dental-Software-Windows-Installer
          path: dist/*.exe

      - name: Create GitHub release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
