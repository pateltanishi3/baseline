name: Build Windows Installer V2

on:
  push:
    branches: [ v2-savefix ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout V2 save-fix branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: go.mod

      - name: Build Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o build/AmitPatelDentalSoftware.exe main.go

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" AmitPatelDentalSoftware.iss

      - name: Smoke test installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "AmitPatelDentalSoftware-V2-Test"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $setup = Get-ChildItem dist\*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir" -Wait
          $app = Join-Path $installDir "AmitPatelDentalSoftware.exe"
          if (!(Test-Path $app)) { throw "Installed application was not found at $app" }
          Write-Host "Installer installation smoke test passed."

      - name: Upload tested V2 installer
        uses: actions/upload-artifact@v4
        with:
          name: Amit-Patel-Dental-Software-V2-Windows-Installer
          path: dist/*.exe

      - name: Publish V2 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2-savefix'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Amit Patel Dental Software V2.0.${{ github.run_number }}
          body: |
            V2 built from the exact master HTML baseline.
            Only the Windows application's local data persistence layer is changed:
            serialized saves, atomic writes, recovery snapshot, local-date handling.
          files: dist/*.exe
          generate_release_notes: false
          make_latest: false
